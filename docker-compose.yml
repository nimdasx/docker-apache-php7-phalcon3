version: "3.7"
services:
    elang:
        build : .
        container_name: sf-phalcon-3-container
        image: nimdasx/apache-php7-phalcon3:latest
        ports:
            - 80:80
        volumes:
            - D:/dev/php:/var/www/html
        networks:
            - sf_network
        restart: always
networks:
    sf_network:
        name: sf_network
